services:
  - type: web
    name: rogueweb-echoes-grid-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CLIENT_ORIGIN
        value: https://rogueweb-echoes-grid.onrender.com

  - type: web
    name: rogueweb-echoes-grid
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_AUTH_REDIRECT_URL
        value: https://rogueweb-echoes-grid.onrender.com
      - key: VITE_API_URL
        value: https://rogueweb-echoes-grid-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
